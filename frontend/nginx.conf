server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # same-origin API — mirrors vite.config.js's dev proxy
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: unknown paths resolve to the client-side router
    location / {
        try_files $uri /index.html;
    }
}
