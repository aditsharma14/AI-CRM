services:
  client:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      ai:
        condition: service_started

  ai:
    build: ./AI
    env_file: ./AI/.env
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  # Local convenience only — production points MONGO_URI at MongoDB Atlas instead.
  # A one-node replica set, not a standalone server: lead conversion runs in a
  # transaction, and MongoDB only supports transactions on replica sets.
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    # Initiates the set on first start (idempotent), then reports healthy, so
    # the api only starts once transactions work.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

volumes:
  mongo-data:
