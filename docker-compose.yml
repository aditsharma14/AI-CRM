# Local convenience only: everything here is free and runs on this machine.
# `docker compose up` starts client (:8080), api, worker, ai and mongo (more workers: `--scale worker=N`). The AI
# service answers with the deterministic fake provider; for a real local model, install Ollama,
# `ollama pull llama3.2:3b`, and set AI_PROVIDER=ollama (readme).
services:
  client:
    build: ./frontend
    ports:
      - '8080:80'
    depends_on:
      - api

  api:
    build: ./backend
    # Optional, so a fresh clone (or CI) runs without a local .env. Values below override it, because the
    # .env.example values (localhost) are wrong inside the compose network.
    env_file:
      - path: ./backend/.env
        required: false
    # Dev stack: the image defaults to production, which refuses the dev-only secret below. The worker reuses this
    # block (&api-env).
    environment: &api-env
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/nimbus-crm?replicaSet=rs0
      CLIENT_ORIGIN: http://localhost:8080
      # Browsers reach the API through the client's nginx, one hop; req.ip (and the rate limiter) then sees the visitor.
      TRUST_PROXY: '1'
      # Reported by /api/v1/health; CI sets it to the commit under test.
      GIT_COMMIT: ${GIT_COMMIT:-dev}
      # Dev-only default; the backend refuses it when NODE_ENV=production. Override with a real one.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-compose-secret-change-me}
      # The AI lead brief, through the ai service below. The token is dev-only; a production boot refuses it.
      AI_ENABLED: 'true'
      AI_SERVICE_URL: http://ai:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-dev-only-compose-ai-token-change-me}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-90000}
    ports:
      - '5000:5000'
    depends_on:
      mongo:
        condition: service_healthy
      ai:
        condition: service_healthy

  # Runs queued AI lead-brief jobs (src/worker.js): the api only queues them, so this is the one caller of `ai`. Same
  # image and settings as the api, no port. Any number can run (`--scale worker=N`); they share the queue in mongo.
  worker:
    build: ./backend
    command: ['node', 'src/worker.js']
    env_file:
      - path: ./backend/.env
        required: false
    environment: *api-env
    # On stop, a worker finishes the job in hand: AI_TIMEOUT_MS (90 s) plus a margin, or Docker's SIGKILL would cut
    # the call off and the job would wait out its lease before another worker retried it.
    stop_grace_period: 100s
    depends_on:
      mongo:
        condition: service_healthy
      ai:
        condition: service_healthy

  # Reachable only on the compose network (no host port): the worker is its one caller, with the shared token.
  ai:
    build: ./AI
    env_file:
      - path: ./AI/.env
        required: false
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-dev-only-compose-ai-token-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      # Ollama runs on the host, not in compose (it wants the machine's whole CPU and RAM).
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-90000}
    extra_hosts:
      # host.docker.internal on Linux too (Docker Desktop provides it already).
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # A one-node replica set, not a standalone server: lead conversion and signup run in transactions,
  # and MongoDB only supports transactions on replica sets.
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    # Initiates the set on first start (idempotent), then reports healthy only once this node is PRIMARY,
    # so the api never connects before transactions work.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; quit(rs.status().myState === 1 ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

volumes:
  mongo-data:
