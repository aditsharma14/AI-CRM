# The smoke test against production (scripts/smoke.mjs through the Vercel URL): every 6 hours, by hand, and after each
# push to main once its deploy is live (keep-warm.yml dispatches it then). It runs only if the API reports this
# workflow's commit; otherwise it passes with a notice, so it never blocks a Render deploy waiting for CI checks, and
# fails only if main's head is over 20 minutes old and still not live. Skipped until the PROD_URL variable exists.
# See docs/deploy.md, section 10.
name: Deploy smoke

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: vars.PROD_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bash scripts/ci/deploy-smoke.sh
        env:
          PROD_URL: ${{ vars.PROD_URL }}
