# Runs on every push and PR. Make "backend" and "frontend" required status checks in the
# branch protection rule for main so a failing lint/typecheck/test blocks merges.
name: CI

on:
  push:
  pull_request:

jobs:
  # Formatting (Prettier for JS/JSON/YAML/CSS, ruff for Python) and ruff lint, from the repo root.
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      # scripts/ruff.mjs runs ruff from AI/.venv, as the pre-commit hook does.
      - run: python -m venv AI/.venv && AI/.venv/bin/pip install -r AI/requirements-dev.txt
      - run: npm run format:check
      - run: node scripts/ruff.mjs check AI

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # mongodb-memory-server downloads a mongod binary on first use; the
      # runner has network access, so no service container is needed.
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # playwright.config.js starts the API (backend/scripts/e2e-server.js,
      # in-memory Mongo) and a Vite dev server itself; both need their deps.
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
