# Runs on every push and PR, and by hand (gh workflow run ci.yml --ref <branch>). The six jobs are required
# checks in main's ruleset, so a PR merges only when they pass. See docs/ci.md.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch (or PR) cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Prettier over the whole repo (JS, JSON, YAML, CSS). Python formatting is the ai job's.
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prettier --check .

  # The FastAPI service: ruff lint and format, and pytest (a placeholder until S2.1 builds the app).
  # Dev tools only; the runtime requirements join when there are real tests to run.
  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: AI/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # mongodb-memory-server downloads a mongod binary on first use; the
      # runner has network access, so no service container is needed.
      # test:coverage fails the job if src/services line coverage drops below the
      # threshold in vitest.config.js (98.65%).
      - run: npm run test:coverage

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The GitHub Pages demo (src/demo/, MSW) must never reach a normal build.
      - run: npm run build
      - run: node scripts/check-no-demo.mjs
      # The first load must not grow unnoticed: entry chunk and initial JS against frontend/bundle-budget.json.
      - run: node scripts/check-bundle-budget.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      # playwright.config.js starts the API (backend/scripts/e2e-server.js,
      # in-memory Mongo, plus a lead-brief worker process) and a Vite dev server itself; both need their deps.
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      # The AI service (fake provider) for the lead-brief spec; playwright.config.js starts it via scripts/ai-serve.mjs.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: AI/requirements.txt
      - run: pip install -r AI/requirements.txt
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results

  # The compose stack as a user runs it: build, start, prove the replica set and a transactional lead
  # conversion through the API (scripts/ci/docker-smoke.sh), then tear down.
  docker:
    runs-on: ubuntu-latest
    env:
      # compose passes it to the api, whose /api/v1/health reports it; smoke.mjs checks it is this commit.
      GIT_COMMIT: ${{ github.sha }}
      SMOKE_EXPECT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      # docker-smoke.sh ends with scripts/smoke.mjs (Node, no dependencies).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker compose version
      - run: docker compose build
      # Returns once mongo is healthy (PRIMARY) and the api, two workers and the client have started. Two workers
      # share one queue: the smoke's brief is claimed by exactly one of them.
      - run: docker compose up -d --scale worker=2
      - run: bash scripts/ci/docker-smoke.sh
        env:
          WORKERS: 2
      - if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - if: always()
        run: docker compose down -v
